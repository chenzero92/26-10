<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>张力流行演唱教室</title>
<style>
body { margin: 0; min-height: 100vh; overflow-x: hidden; font-family: sans-serif; color: #e8ecff; line-height: 1.8;
  background: linear-gradient(to bottom, #01020a 0%, #050a26 45%, #0c1a4a 80%, #1a2a60 100%);
  background-attachment: fixed; }
.sky { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
.milkyway { position: absolute; top: -15%; left: -25%; width: 150%; height: 55%; transform: rotate(-28deg);
  background: linear-gradient(to bottom, transparent, rgba(150,170,255,.15) 35%, rgba(255,235,215,.25) 50%, rgba(150,170,255,.15) 65%, transparent);
  filter: blur(28px); }
.star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle 4s infinite ease-in-out; }
@keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
.dune1 { position: fixed; bottom: -90px; left: -20%; width: 90%; height: 220px; background: #04050d; border-radius: 50% 50% 0 0; z-index: 0; }
.dune2 { position: fixed; bottom: -70px; right: -20%; width: 85%; height: 180px; background: #090b1a; border-radius: 50% 50% 0 0; z-index: 0; }
.content { position: relative; z-index: 1; max-width: 600px; margin: 40px auto; padding: 30px 24px;
  background: rgba(5,10,40,.45); border-radius: 16px; backdrop-filter: blur(6px); }
h1 { margin-top: 0; }
</style>
</head>
<body>
<div class="sky" id="sky"><div class="milkyway"></div></div>
<div class="dune1"></div>
<div class="dune2"></div>
<div class="content">
<h1>张力流行演唱教室</h1>
<p>一对一流行演唱教学，位于长沙。</p>
<h2>关于老师</h2>
<p>18 年演唱经验，8 年教学经验。</p>
</div>
<script>
var sky = document.getElementById('sky');
for (var i = 0; i < 260; i++) {
  var s = document.createElement('div');
  s.className = 'star';
  var size = Math.random() * 2 + 0.8;
  s.style.width = size + 'px';
  s.style.height = size + 'px';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 80 + '%';
  s.style.animationDuration = (2 + Math.random() * 5) + 's';
  s.style.animationDelay = (Math.random() * 5) + 's';
  sky.appendChild(s);
}
</script>
</body>
</html>
